<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX</title>
    <style>
.container{
    border:2px solid black;
    height: 500px;
    display:flex;
    align-items: center;
    justify-content:center;
    background-color: grey;
}
    .item{
        border:2px solid black;
        height: 50px;
        width: 50px;
        margin: 10px;
        font-weight:bold;
        font-size:20px;
        flex-wrap: wrap;
        background-color: cornflowerblue;
        

}
        </style>
</head>
<body>
    <div class="container">
        <div class="item" style="background-color: aqua;">PKR</div>
        <div class="item" style="background-color: rgb(0, 255, 51);">PSR</div>
        <div class="item" style="background-color: rgb(212, 255, 0);">PVSR</div>
        <div class="item" style="background-color:rgb(226, 43, 147);">PVR</div>
        </div>
</body>
</html>
