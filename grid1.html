<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            border: 2px solid brown;
            display:grid;
            grid-template-areas: "nav nav nav" "article article article" "footer footer footer";
            gap:20px;
        }
        .item{
           
            background-color: aqua;
            font-size: 50px;
            text-align: center;
        }
        .item1{
            grid-row: 2/3;
            grid-column: 1/2;
            background-color:rgb(43, 226, 226);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">A</div>
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        </div>      
</body>
</html>
