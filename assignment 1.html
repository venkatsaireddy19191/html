<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Countdown App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .event-form, .event-list { max-width: 600px; margin: auto; }
    .event-card { border: 1px solid #ccc; padding: 15px; margin-top: 10px; border-radius: 8px; position: relative; }
    .category-Birthday { background-color: #ffe0e0; }
    .category-Meeting { background-color: #e0f7ff; }
    .category-Holiday { background-color: #e0ffe0; }
    .category-Custom { background-color: #f0e0ff; }
    .actions { margin-top: 10px; }
    .actions button { margin-right: 10px; }
  </style>
</head>
<body>
  <h1>Dynamic Event Countdown</h1>

  <div class="event-form">
    <form id="eventForm">
      <input type="text" id="title" placeholder="Event Title" required><br><br>
      <textarea id="description" placeholder="Event Description"></textarea><br><br>
      <input type="datetime-local" id="datetime" required><br><br>
      <input type="email" id="email" placeholder="Email for Reminder (optional)"><br><br>
      <select id="category">
        <option value="Birthday">Birthday</option>
        <option value="Meeting">Meeting</option>
        <option value="Holiday">Holiday</option>
        <option value="Custom">Custom</option>
      </select><br><br>
      <button type="submit">Add Event</button>
    </form>
  </div>

  <div class="event-list" id="eventList"></div>

  <script>
    const form = document.getElementById('eventForm');
    const eventList = document.getElementById('eventList');
    let events = JSON.parse(localStorage.getItem('events') || '[]');

    function saveEvents() {
      localStorage.setItem('events', JSON.stringify(events));
    }

    function updateCountdowns() {
      const now = new Date();
      eventList.innerHTML = '';

      events.forEach((event, index) => {
        const eventTime = new Date(event.datetime);
        const diff = eventTime - now;
        let countdown = '';

        if (diff > 0) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / (1000 * 60)) % 60);
          const seconds = Math.floor((diff / 1000) % 60);
          countdown = `${days} Days ${hours}:${minutes}:${seconds}`;

          // Simulate email reminder 1 day before
          if (days === 1 && !event.notified && event.email) {
            console.log(`Reminder: '${event.title}' is happening tomorrow. Email sent to: ${event.email}`);
            alert(`Reminder: '${event.title}' is happening tomorrow.`);
            event.notified = true;
            saveEvents();
          }
        } else {
          countdown = `🎉 ${event.title} is happening now!`;
        }

        const card = document.createElement('div');
        card.className = `event-card category-${event.category}`;
        card.innerHTML = `
          <strong>${event.title}</strong> <em>(${event.category})</em><br>
          ${event.description}<br>
          Countdown: <strong>${countdown}</strong><br>
          ${event.email ? `Email Reminder Set to: ${event.email}` : ''}
          <div class="actions">
            <button onclick="deleteEvent(${index})">Delete</button>
          </div>
        `;
        eventList.appendChild(card);
      });
    }

    function deleteEvent(index) {
      if (confirm('Are you sure you want to delete this event?')) {
        events.splice(index, 1);
        saveEvents();
        updateCountdowns();
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const datetime = document.getElementById('datetime').value;
      const email = document.getElementById('email').value;
      const category = document.getElementById('category').value;

      if (new Date(datetime) <= new Date()) {
        alert('Please choose a future date and time.');
        return;
      }

      events.push({ title, description, datetime, email, category, notified: false });
      saveEvents();
      form.reset();
      updateCountdowns();
    });
   setInterval(updateCountdowns, 1000);
    updateCountdowns();
  </script>
</body>
</html>
