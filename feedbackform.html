<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .rating-container {
            text-align: center;
            margin: 15px 0;
        }
        .emoji-display {
            font-size: 40px;
            margin-bottom: 10px;
            height: 45px;
        }
        .star-rating {
            display: flex;
            justify-content: center;
        }
        .star {
            font-size: 30px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star:hover,
        .star.active {
            color: gold;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h2>Feedback Form</h2>
    <form id="feedbackForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label>Rating:</label>
            <div class="rating-container">
                <div class="emoji-display" id="emojiDisplay">😐</div>
                <div class="star-rating">
                    <span class="star" data-rating="1">★</span>                                                                               
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
                <input type="hidden" id="ratingValue" name="rating" value="3">
            </div>
        </div>
        
        <div class="form-group" id="reasonGroup">
            <label for="reason">Reason for Rating:</label>
            <textarea id="reason" name="reason"></textarea>
        </div>
        
        <button type="submit">Submit</button>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const stars = document.querySelectorAll('.star');
            const emojiDisplay = document.getElementById('emojiDisplay');
            const ratingInput = document.getElementById('ratingValue');
            const reasonGroup = document.getElementById('reasonGroup');
            const reasonField = document.getElementById('reason');
            
            // Emoji mapping
            const emojis = {
                1: '😠',
                2: '😕',
                3: '😐',
                4: '🙂',
                5: '😊'
            };
            
            // Initialize with 3 stars
            highlightStars(3);
            
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = parseInt(this.getAttribute('data-rating'));
                    ratingInput.value = rating;
                    highlightStars(rating);
                    emojiDisplay.textContent = emojis[rating];
                    
                    if (rating === 5) {
                        reasonGroup.classList.add('hidden');
                        reasonField.required = false;
                    } else {
                        reasonGroup.classList.remove('hidden');
                        reasonField.required = true;
                    }
                });
                
                star.addEventListener('mouseover', function() {
                    const rating = parseInt(this.getAttribute('data-rating'));
                    highlightStars(rating);
                    emojiDisplay.textContent = emojis[rating];
                });
                
                star.addEventListener('mouseout', function() {
                    const currentRating = parseInt(ratingInput.value);
                    highlightStars(currentRating);
                    emojiDisplay.textContent = emojis[currentRating];
                });
            });
            
            function highlightStars(rating) {
                stars.forEach(star => {
                    const starRating = parseInt(star.getAttribute('data-rating'));
                    if (starRating <= rating) {
                        star.classList.add('active');
                    } else {
                        star.classList.remove('active');
                    }
                });
            }
            
            document.getElementById('feedbackForm').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Form submitted successfully!');
                this.reset();
                // Reset to default 3 stars
                ratingInput.value = 3;
                highlightStars(3);
                emojiDisplay.textContent = emojis[3];
                reasonGroup.classList.remove('hidden');
                reasonField.required = true;
            });
        });
    </script>
</body>
</html>
