<!DOCTYPE html>
<html>
<head>
  <title>Navbar with Icons</title>
  <!-- Font Awesome CDN for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <nav style="background-color:#333; padding:10px;">
    <a href="#home" style="color:white; margin-right:15px; text-decoration:none;">
      <i class="fas fa-home"></i> Home
    </a>
    <a href="#about" style="color:white; margin-right:15px; text-decoration:none;">
      <i class="fas fa-user"></i> About
    </a>
    <a href="#services" style="color:white; margin-right:15px; text-decoration:none;">
      <i class="fas fa-cogs"></i> Services
    </a>
    <a href="#contact" style="color:white; text-decoration:none;">
      <i class="fas fa-envelope"></i> Contact
    </a>
  </nav>

</body>
</html>
