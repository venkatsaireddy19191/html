    <body>
    <form action = "" method="post">
    <FIELDSET>
        <legend>Login Form</legend>
        <label>Username:</label>
        <input type="text" name="username" placeholder="Enter your username" required>
        <br><br>
        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter your password" required>
        <br><br>
        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="Gender" value="Male" required/>Male
        <input type="radio" name="Gender" value="Female"/>Female
        <br><br>
        <label>Date:</label>
        <input type="date" name="date" required>
        <br><br>
        <label>course:</label>
        <select name="course" required>
            <option value="BCA">B TECH</option>
            <option value="BBA">BBA</option>
            <option value="BSc">BSc</option>
            <option value="MCA">MCA</option>
        </select>
        <br><br>
        <label>Address</label>
        <textarea name="address" rows="5" cols="50" placeholder="Enter your address" required></textarea>
        <br><br>
        <label>Phone Number:</label>
        <input type="tel" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required>
        <br><br>
        <label>Files upload:</label>
        <input type="file" name="file" accept=".jpg, .jpeg, .png, .pdf" required>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

        </FIELDSET>

</form>
