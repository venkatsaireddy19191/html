<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 100vh;
            display:grid;
            grid-template-areas: "nav nav nav nav"
                                 "ann ann art art"
                                 "res res res info"
                                 "foot foot foot foot";
        }
        .item1{
            background-color: red;
            grid-area: nav;
        }
        .item2{
            background-color: yellow;
            grid-area:ann;
        }
        .item3{
            background-color: blue;
            grid-area: art;
        }
        .item4{
            background-color: green;
            grid-area: res;
        }
        .item5{
            background-color: orange;
            grid-area: info;
        }
        .item6{
            background-color: grey;
            grid-area: foot;
        }
    </style>
</head>
<body>
    <nav class="container">
        <div class="item item1">Navigation</div>
        <div class="item item2">Announcements</div>
        <div class="item item3">Article</div>
        <div class="item item4">Result</div>
        <div class="item item5">Info</div>
        <div class="item item6">footer</div>
    
        </ul>
    </nav>
    
</body>
</html>
